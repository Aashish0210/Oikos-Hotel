<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#e67e22" stroke-opacity="0.35" stroke-width="4"/>
  
  <!-- 'the' in elegant italic serif -->
  <text x="256" y="160" font-family="'Lora', 'Playfair Display', Georgia, serif" font-style="italic" font-size="52" fill="#d4a373" text-anchor="middle">the</text>
  
  <!-- 'OIKOS' in bold modern sans-serif -->
  <text x="256" y="275" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="122" fill="#e67e22" letter-spacing="1" text-anchor="middle">OIKOS</text>
  
  <!-- 'HOTEL' in tracked uppercase -->
  <text x="261" y="360" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="36" fill="#ffffff" letter-spacing="12" text-anchor="middle">HOTEL</text>
  
  <!-- Underline accent bar -->
  <rect x="216" y="385" width="80" height="4" rx="2" fill="#e67e22" fill-opacity="0.8"/>
</svg>
